<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: white;
            min-height: 100vh;
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background-color: white;
            width: 400px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .login-card h1 {
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-control {
            padding: 12px;
            border-radius: 10px;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 25px;
            background-color: #6654e8;
            color: white;
            font-weight: bold;
            font-size: 17px;
        }

        .login-btn:hover {
            background-color: #5140d0;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #6654e8;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h1>Admin Login</h1>

            <form method="POST" action="{% url 'admin_dashboard' %}">
               {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Username</label>

                    <input type="text"
                           name="username"
                           class="form-control"
                           placeholder="Enter admin username"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>

                    <input type="password"
                           name="password"
                           class="form-control"
                           placeholder="Enter your password"
                           required>
                </div>

                <button type="submit" class="login-btn">
                    Login
                </button>

            </form>

            <a href="{% url 'home' %}" class="back-home">
                ← Back to Home
            </a>

        </div>

    </div>

</body>

</html>
