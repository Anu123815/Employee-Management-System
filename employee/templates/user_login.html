<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            margin: 0;
            background-color: #f6f5fa;
            font-family: Arial, sans-serif;
        }

        .login-section {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 400px;
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .login-card h2 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .form-control {
            padding: 12px;
            border-radius: 10px;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background-color: #6255e7;
            color: white;
            font-size: 17px;
        }

        .login-btn:hover {
            background-color: #4e43c7;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #6255e7;
        }

    </style>
</head>

<body>

    <section class="login-section">

        <div class="login-card">

            <h2>User Login</h2>

            <form method="POST" action="{% url 'user_dashboard' %}">
                  {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Username</label>

                    <input
                        type=""text
                        class="form-control"
                        placeholder="Enter your username">
                </div>


                <div class="mb-3">

                    <label class="form-label">Password</label>

                    <input
                        type="password"
                        class="form-control"
                        placeholder="Enter your password">

                </div>


                <button type="submit" class="login-btn">
                    Login
                </button>

            </form>


            <a href="/" class="back-home">
                ← Back
            </a>

        </div>

    </section>

</body>

</html>
