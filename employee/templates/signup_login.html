<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background-color: white;
            min-height: 100vh;
        }

        .signup-container {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .signup-card {

            background-color: white;

            width: 450px;

            padding: 40px;

            border-radius: 20px;

            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .signup-card h1 {

            text-align: center;

            font-weight: bold;

            margin-bottom: 10px;
        }

        .subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 30px;
        }

        .form-control {

            padding: 12px;

            border-radius: 10px;
        }

        .signup-btn {

            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 25px;

            background-color: #6654e8;

            color: white;

            font-weight: bold;

            font-size: 17px;
        }

        .signup-btn:hover {

            background-color: #5140d0;
        }

        .login-link {

            text-align: center;

            margin-top: 20px;
        }

        .login-link a {

            color: #6654e8;

            text-decoration: none;

            font-weight: bold;
        }

        .back-home {

            display: block;

            text-align: center;

            margin-top: 15px;

            text-decoration: none;

            color: #6654e8;
        }

    </style>

</head>

<body>

    <div class="signup-container">

        <div class="signup-card">

            <h1>Create Account</h1>

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">
                        Full Name
                    </label>

                    <input type="text"
                           name="fullname"
                           class="form-control"
                           placeholder="Enter your full name"
                           required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Username
                    </label>

                    <input type="text"
                           name="username"
                           class="form-control"
                           placeholder="Enter your username"
                           required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input type="email"
                           name="email"
                           class="form-control"
                           placeholder="Enter your email"
                           required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Password
                    </label>

                    <input type="password"
                           name="password"
                           class="form-control"
                           placeholder="Create a password"
                           required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Confirm Password
                    </label>

                    <input type="password"
                           name="confirm_password"
                           class="form-control"
                           placeholder="Confirm your password"
                           required>

                </div>


                <button type="submit"
                        class="signup-btn">

                    Create Account

                </button>

            </form>


            <div class="login-link">

                Already have an account?

                <a href="{% url 'home' %}">
                    Login
                </a>

            </div>


            <a href="{% url 'home' %}"
               class="back-home">

                ← Back to Home

            </a>

        </div>

    </div>

</body>

</html>
